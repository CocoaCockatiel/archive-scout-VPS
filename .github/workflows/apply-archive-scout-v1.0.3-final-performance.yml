name: Apply Archive Scout 1.0.3 Final Performance Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: archive-scout-v1-0-3-installer
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and validate v1.0.3
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-runtime.txt

      - name: Verify clean v1.0.2 base or existing v1.0.3
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Repository checkout is not clean before installation."
            git status --short
            exit 1
          fi
          version="$(python - <<'PYVERIFY'
          from pathlib import Path
          import re
          constants = Path("archive_scout/constants.py").read_text(encoding="utf-8")
          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          app = re.search(r'^VERSION\s*=\s*"([^"]+)"', constants, re.M)
          pkg = re.search(r'^version\s*=\s*"([^"]+)"', pyproject, re.M)
          if not app or not pkg:
              raise SystemExit("Could not determine Archive Scout version")
          if app.group(1) != pkg.group(1):
              raise SystemExit(f"Version mismatch: app={app.group(1)!r} package={pkg.group(1)!r}")
          print(app.group(1))
          PYVERIFY
          )"
          case "$version" in
            1.0.2)
              echo "ALREADY_APPLIED=false" >> "$GITHUB_ENV"
              ;;
            1.0.3)
              echo "ALREADY_APPLIED=true" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Installer requires Archive Scout 1.0.2, or an already-applied 1.0.3 tree; found $version"
              exit 1
              ;;
          esac
          echo "Detected Archive Scout $version"

      - name: Reconstruct verified performance patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/archive-scout-v1.0.3.patch.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 --decode /tmp/archive-scout-v1.0.3.patch.b64 > /tmp/archive-scout-v1.0.3.patch
          rm -f /tmp/archive-scout-v1.0.3.patch.b64
          actual="$(sha256sum /tmp/archive-scout-v1.0.3.patch | awk '{print $1}')"
          expected="78ef89eb5e76ffc40cdbc43ee76ac350f3b10298524d05796ad491676d27d11a"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Embedded patch checksum mismatch."
            exit 1
          fi
          echo "Patch SHA-256 verified: $actual"

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ALREADY_APPLIED" == "false" ]]; then
            git apply --check /tmp/archive-scout-v1.0.3.patch
            git apply /tmp/archive-scout-v1.0.3.patch
            echo "Archive Scout v1.0.3 patch applied."
          else
            if git apply --reverse --check /tmp/archive-scout-v1.0.3.patch; then
              echo "Archive Scout v1.0.3 patch is already applied; continuing with validation."
            else
              echo "::error::Repository reports 1.0.3 but does not match the expected patch state."
              exit 1
            fi
          fi
          git diff --check

      - name: Verify exactly the approved source changes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files.txt <<'EXPECTED'
          .github/workflows/tests.yml
          CHANGELOG.md
          README.md
          RELEASE_NOTES.md
          REPOSITORY_DETAILS.md
          SOURCE_VALIDATION.txt
          UPLOAD_CHECKLIST.txt
          archive_scout/ai/providers/openai.py
          archive_scout/ai/providers/openrouter.py
          archive_scout/analysis/diffs.py
          archive_scout/analysis/workflow.py
          archive_scout/cdx/client.py
          archive_scout/cdx/indexer.py
          archive_scout/cdx/parallel.py
          archive_scout/cdx/parameters.py
          archive_scout/cli.py
          archive_scout/config.py
          archive_scout/constants.py
          archive_scout/content.py
          archive_scout/database/repositories.py
          archive_scout/database/schema.py
          archive_scout/downloads/downloader.py
          archive_scout/media/discovery.py
          archive_scout/media/extensions.py
          archive_scout/media/indexer.py
          archive_scout/operations.py
          archive_scout/reports/text.py
          archive_scout/research/embeddings.py
          archive_scout/research/index.py
          archive_scout/research/search.py
          archive_scout/scanning/automaton.py
          archive_scout/scanning/keywords.py
          archive_scout/scanning/scoring.py
          archive_scout/ui/main_window.py
          docs/AUTOMATION.md
          docs/DEVELOPMENT.md
          docs/GITHUB_SETUP.md
          examples/ogrish_911.project.json
          examples/project.example.json
          packaging/macos/README.md
          packaging/windows/version_info.txt
          pyproject.toml
          tests/unit/test_cdx_response_recovery.py
          tests/unit/test_cli_automation.py
          tests/unit/test_fast_indexing.py
          tests/unit/test_final_performance.py
          tests/unit/test_index_recovery.py
          tests/unit/test_network_tuning.py
          tests/unit/test_startup.py
          EXPECTED
          if [[ "$ALREADY_APPLIED" == "false" ]]; then
            { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/actual-files.txt
            if ! diff -u /tmp/expected-files.txt /tmp/actual-files.txt; then
              echo "::error::Patch changed an unexpected file or failed to change an expected file."
              exit 1
            fi
          elif [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Already-applied v1.0.3 checkout is unexpectedly dirty."
            git status --short
            exit 1
          fi
          if find . -maxdepth 3 -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo "::error::Potential credential file detected in repository."
            exit 1
          fi

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip check

      - name: Compile and verify release identity
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q archive_scout tests scripts/benchmark_offline.py run_app.py run_cli.py
          python - <<'PYIDENTITY'
          import importlib.metadata
          from archive_scout.constants import VERSION, SCHEMA_VERSION
          assert VERSION == "1.0.3", VERSION
          assert importlib.metadata.version("archive-scout") == "1.0.3"
          assert SCHEMA_VERSION == 7, SCHEMA_VERSION
          print("Archive Scout 1.0.3 / schema 7 identity verified")
          PYIDENTITY

      - name: Run complete regression suite
        shell: bash
        env:
          TERM: xterm
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee /tmp/archive-scout-v1.0.3-tests.txt
          grep -Eq '^Ran 178 tests in ' /tmp/archive-scout-v1.0.3-tests.txt
          grep -Eq '^OK( \(skipped=1\))?$' /tmp/archive-scout-v1.0.3-tests.txt

      - name: Run 100,000-row offline performance validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark_offline.py \
            --cdx-rows 100000 \
            --cdx-chunk-rows 50000 \
            --result-rows 10000 \
            --body-bytes 2048 \
            --keyword-patterns 5000 \
            --keyword-searches 200 \
            --keyword-score-runs 100 \
            --output /tmp/archive-scout-v1.0.3-benchmark.json
          python - <<'PYBENCH'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/archive-scout-v1.0.3-benchmark.json").read_text(encoding="utf-8"))
          assert payload["cdx_rows_inserted"] == 100000, payload["cdx_rows_inserted"]
          assert payload["unchanged_cdx_writes"] == 0, payload["unchanged_cdx_writes"]
          assert payload["duplicate_work"] == 0, payload["duplicate_work"]
          assert payload["http_attempts"] == 0, payload["http_attempts"]
          print("100,000-row offline benchmark invariants verified")
          PYBENCH

      - name: Stage only approved patch files
        if: env.ALREADY_APPLIED == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t approved < /tmp/expected-files.txt
          git add -- "${approved[@]}"
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/staged-files.txt
          if ! diff -u /tmp/expected-files.txt /tmp/staged-files.txt; then
            echo "::error::Unexpected staged files."
            exit 1
          fi
          git status --short

      - name: Commit and push v1.0.3
        if: env.ALREADY_APPLIED == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release Archive Scout 1.0.3 final performance update"
          git push origin HEAD:main

      - name: Start full Tests workflow
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh workflow run tests.yml --ref main; then
            echo "Full cross-platform Tests workflow dispatched."
          else
            echo "::warning::v1.0.3 is installed and locally validated, but GitHub would not dispatch Tests automatically. Open Actions > Tests and choose Run workflow on main."
          fi
